name: slate_app
description: "Slate - Task management app with streak gamification"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7

  # Speech to Text
  speech_to_text: ^7.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Home Widget
  home_widget: ^0.7.0

  # Timezone
  timezone: ^0.10.0

  # Permissions
  permission_handler: ^11.3.1

  # AI Integration
  http: ^1.2.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
